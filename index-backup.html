<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title>Markdown page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
    integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU" crossorigin="anonymous">
  <style>
    :root { --pico-font-size: 17px; }
    main.container { width: 100%; max-width: 900px; padding: 2rem 24px; }
    #readme h1 { max-width: 24ch; }
    #readme h2 { margin-top: 2.5rem; }
    .downloads { display: flex; gap: .75rem; flex-wrap: wrap; }
    .downloads a[role="button"] { margin: 0; }
    .image-scroll, .table-scroll { overflow-x: auto; }
    #readme img { display: block; max-width: 100%; height: auto; border-radius: var(--pico-border-radius); }
    .note, footer { font-size: .85rem; color: var(--pico-muted-color); }
    .snippet { border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); overflow: hidden; margin-bottom: var(--pico-spacing); background: var(--pico-code-background-color); }
    .snippet-header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .4rem .8rem; font-size: .8rem; color: var(--pico-muted-color); }
    .copy-button { display: inline-flex; align-items: center; gap: .5rem; padding: .35rem .5rem; margin: 0; width: auto; font-size: .8rem; }
    [hidden] { display: none !important; }
    #reader-status { padding: 1rem; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); }
    input[type="file"] { max-width: 100%; }
    #readme > h1 + p { max-width: 65ch; font-size: 1.15rem; }
    #readme > hr:last-of-type + p:last-child { font-size: .85rem; color: #596277; }
    #readme table { display: block; overflow-x: auto; }
    .snippet-header { margin-top: 1rem; border: 1px solid #dce1ea; border-bottom: 0; border-radius: 8px 8px 0 0; }
    pre.snippet { overflow-x: auto; margin-top: 0; border-radius: 0 0 8px 8px; }
  </style>
</head>
<body>
<main class="container">
  <div id="reader-status" role="status">
    <p id="reader-message">Loading README.md…</p>
    <label for="readme-file">Open the repository's README.md locally:</label>
    <input id="readme-file" type="file" accept=".md,.markdown,text/markdown,text/plain">
  </div>
  <noscript>This Markdown reader needs JavaScript. <a href="./README.md">Open README.md</a>.</noscript>
  <div id="readme" hidden role="article" aria-label="Project README"></div>
</main>
<!-- markdown-it, MIT license: https://github.com/markdown-it/markdown-it -->
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.3.1/dist/markdown-it.min.js"
  integrity="sha384-IF/ihN6MBBPHKc43xgEJ5BgCjo1CdWWM++Oq7PzjY8GiLMKCb1LcmktqP8+eakiO"
  crossorigin="anonymous"></script>
<script>
(() => {
  const content = document.getElementById('readme');
  const status = document.getElementById('reader-status');
  const message = document.getElementById('reader-message');
  const picker = document.getElementById('readme-file');
  const icon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
  if (!window.markdownit) {
    message.textContent = 'Could not load the Markdown reader. Check your connection and reload.';
    picker.disabled = true;
    return;
  }
  const parser = window.markdownit({ html: false, linkify: true });

  // Markdown handles fences; this rule only omits marked repository-only blocks.
  parser.block.ruler.before('html_block', 'github_only', (state, start, end, silent) => {
    const line = n => state.src.slice(state.bMarks[n], state.eMarks[n]).trim();
    if (line(start) !== '\x3c!-- github-only:start -->') return false;
    if (silent) return true;
    let next = start + 1;
    while (next < end && line(next) !== '\x3c!-- github-only:end -->') next++;
    if (next === end) throw new Error('Unclosed github-only block');
    state.line = next + 1;
    return true;
  });

  // Optional README metadata: title, description and repository (plain key: value).
  parser.block.ruler.before('html_block', 'website', (state, start, end, silent) => {
    const line = n => state.src.slice(state.bMarks[n], state.eMarks[n]).trim();
    if (line(start) !== '\x3c!-- website') return false;
    if (silent) return true;
    const metadata = state.env.website ||= {};
    let next = start + 1;
    for (; next < end && line(next) !== '-->'; next++) {
      const entry = line(next).match(/^(title|description|repository):\s*(.*)$/);
      if (entry) metadata[entry[1]] = entry[2].replace(/^(["'])(.*)\1$/, '$2');
    }
    if (next === end) throw new Error('Unclosed website metadata block');
    state.line = next + 1;
    return true;
  });

  function render(text) {
    const env = {};
    content.innerHTML = parser.render(text, env);
    const metadata = env.website || {};
    const heading = content.querySelector('h1');
    const intro = heading?.nextElementSibling;
    document.title = metadata.title || heading?.textContent.trim() || 'Markdown page';
    document.querySelector('meta[name="description"]').content = metadata.description ||
      (intro?.tagName === 'P' ? intro.textContent.replace(/\s+/g, ' ').trim() : '');
    // Optional GitHub repository for relative documentation links.
    const repository = metadata.repository ? new URL(metadata.repository) : null;
    if (repository && !['http:', 'https:'].includes(repository.protocol)) {
      throw new Error('Repository must be an HTTP or HTTPS URL');
    }
    const repo = repository ? repository.href.replace(/\/$/, '') + '/blob/main/' : null;
    // The first paragraph consisting entirely of links becomes the button row.
    const downloads = [...content.querySelectorAll('p')].find(p =>
      p.querySelector('a') && [...p.childNodes].every(n =>
        n.nodeName === 'A' || (n.nodeType === 3 && !n.textContent.trim())));
    downloads?.classList.add('downloads');
    downloads?.querySelectorAll('a').forEach((a, i) => {
      a.setAttribute('role', 'button');
      a.className = i ? 'button secondary outline' : 'button primary';
    });
    // Markdown documentation links open on GitHub; images stay relative.
    content.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (repo && !/^(?:[a-z][a-z\d+.-]*:|\/\/|#)/i.test(href) && /\.md(?:[?#]|$)/i.test(href)) a.href = new URL(href, repo).href;
    });
    content.querySelectorAll('pre > code').forEach(code => {
      const pre = code.parentElement;
      pre.classList.add('snippet');
      const bar = document.createElement('div');
      bar.className = 'snippet-header';
      bar.innerHTML = '<span>Code</span><button type="button" class="copy-button secondary outline" aria-label="Copy code"><span class="copy-feedback" role="status"></span>' + icon + '</button>';
      pre.before(bar);
      bar.querySelector('button').addEventListener('click', async () => {
        const feedback = bar.querySelector('.copy-feedback');
        try {
          await navigator.clipboard.writeText(code.textContent);
          feedback.textContent = 'Copied!';
        } catch {
          const range = document.createRange();
          range.selectNodeContents(code);
          const selection = window.getSelection();
          selection.removeAllRanges(); selection.addRange(range);
          feedback.textContent = 'Selected — press Ctrl+C or ⌘C';
        }
        setTimeout(() => { feedback.textContent = ''; }, 4000);
      });
    });
    content.hidden = false;
    status.hidden = true;
  }

  async function show(read) {
    try { render(await read()); }
    catch (error) {
      message.textContent = location.protocol === 'file:'
        ? 'Local mode: select the root README.md below. Nothing is uploaded.'
        : `Could not load README.md: ${error.message}. Reload or select it below.`;
      status.hidden = false;
    }
  }
  picker.addEventListener('change', () => {
    if (picker.files[0]) show(() => picker.files[0].text());
  });
  show(async () => {
    const response = await fetch('./README.md', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.text();
  });
})();
</script>
</body>
</html>
