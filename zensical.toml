[project]
site_name = "US International — AltGr dead keys"
site_description = "US keyboard layout with AltGr accents and symbols for Spanish, Portuguese and more."
site_url = "https://athesto.github.io/keyboard-layouts/"
repo_url = "https://github.com/Athesto/keyboard-layouts"
edit_uri = ""
docs_dir = "docs"
site_dir = ".zensical-site"
nav = [{ Home = "index.md" }]
watch = ["README.md", "pictures", "mac"]

[project.theme]
variant = "modern"
language = "en"
font = false
features = ["content.code.copy"]

[project.markdown_extensions]
tables = {}
attr_list = {}
pymdownx.highlight = {}
pymdownx.superfences = {}

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
