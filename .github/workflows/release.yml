name: Build and prerelease
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (no publication for manual runs)'
        default: '0.0.0'
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate and test Linux-derived layouts
        run: |
          python tools/generate_from_linux.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/compare_linux.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p 'test_*.py'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- mac/us-intl-altgr.keylayout windows/us-intl-altgr.klc windows/us-intl-altgr.report.json linux/us-intl-altgr.json linux/comparison.json linux/COMPARISON.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare pinned build tools
        run: |
          python tools/setup_msklc.py "$env:RUNNER_TEMP/msklc"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP/wix"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build MSI and ZIP
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = '0.0.0'
          if ($env:EVENT -eq 'push') { $version = $env:TAG }
          elseif ($env:EVENT -eq 'workflow_dispatch') { $version = $env:INPUT_VERSION }
          python tools/build_windows.py --msklc "$env:RUNNER_TEMP/msklc/sdk" --wix "$env:RUNNER_TEMP/wix/wix.exe" --version $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: windows/dist/ci/
          if-no-files-found: warn
  prerelease:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-assets
      - name: Publish prerelease without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --prerelease --latest=false \
            --title "US International AltGr $TAG" \
            --notes-file .github/release-notes.md \
            release-assets/us-intl-altgr-diagnostics-*.zip release-assets/*.msi \
            release-assets/SHA256SUMS.txt
