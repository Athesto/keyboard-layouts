name: Publish website with Zensical
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Zensical
        run: python -m pip install zensical==0.0.72
      - name: Prepare images and downloads
        run: |
          mkdir -p docs/pictures docs/mac
          cp -R pictures/. docs/pictures/
          cp -R mac/. docs/mac/
      - name: Build website
        run: zensical build --config-file zensical.toml
      - name: Verify published files
        run: |
          test -s .zensical-site/index.html
          grep -q '<table' .zensical-site/index.html
          cmp pictures/us-intl-altgr.png .zensical-site/pictures/us-intl-altgr.png
          cmp mac/us-intl-altgr.keylayout .zensical-site/mac/us-intl-altgr.keylayout
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .zensical-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
