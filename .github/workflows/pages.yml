name: Publish landing page
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pandoc/actions/setup@50931da58a60c003a5173d80d8c0cec597365bbe # v1
        with:
          version: '3.12.1'
      - name: Generate static landing page
        run: >-
          pandoc README.md --from=gfm --to=html5 --standalone
          --template=site/template.html --lua-filter=site/landing.lua
          --syntax-highlighting=none --wrap=none --output=index.html
      - name: Verify static output and filter rules
        run: python3 tools/test_site.py
      - name: Prepare site with repository file paths
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pages-site"
          cp index.html "$RUNNER_TEMP/pages-site/index.html"
          rm -f "$RUNNER_TEMP/pages-site/index-backup.html"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
